name: Rappel vendredi (manuel uniquement) - push + email ouverture des commandes

# Les envois automatiques sont faits par Supabase (fonction rappels-clients + pg_cron),
# à l'heure exacte de Paris : GitHub lançait ces envois avec plusieurs heures de retard.
# Ce workflow reste disponible pour un envoi manuel de secours (onglet Actions → Run workflow).
on:
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install pywebpush
      - name: Envoi des notifications push
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: python scripts/send_push_vendredi.py

  email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Envoi des emails de rappel
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: python scripts/send_email_vendredi.py
