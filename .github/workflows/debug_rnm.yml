name: "Diagnostic connexion RNM (DEBUG)"

on:
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Diagnostic RNM (lecture seule, ne touche pas Supabase)
        run: python scripts/_debug_rnm_diagnostic.py
