name: Alerte maj legumes (jeudi)

on:
  schedule:
    - cron: '0 15 * * 4'   # Chaque jeudi 17h heure française (15h UTC)
  workflow_dispatch:        # Permet aussi un declenchement manuel pour tester

jobs:
  alerte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install pywebpush
      - name: Verification et alerte si necessaire
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: python scripts/alerte_maj_legumes.py
